services:
  # -----------------------------------------------------------------------
  # Grama Mitra — Unified Full-Stack Application (React UI + FastAPI Backend)
  # -----------------------------------------------------------------------
  - type: web
    name: grama-mitra-api
    runtime: python
    region: singapore          # Closest to Tamil Nadu / India
    plan: starter              # Free tier available; upgrade for production

    # Build phase — builds React frontend SPA assets and installs Python requirements
    buildCommand: npm --prefix ../frontend install && npm --prefix ../frontend run build && pip install -r requirements.txt

    # Start command — $PORT is injected automatically by Render
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets

    # Health check (Render pings /api/health to verify service status)
    healthCheckPath: /api/health

    # Environment variables (set values in Render Dashboard → Environment)
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: TELEPHONY_ENABLED
        value: "false"

      - key: TELEPHONY_MOCK_MODE
        value: "true"

      - key: GEMINI_API_KEY
        sync: false            # Set in Render Dashboard -> Environment

      - key: EXOTEL_ACCOUNT_SID
        sync: false

      - key: EXOTEL_API_KEY
        sync: false

      - key: EXOTEL_API_TOKEN
        sync: false

      - key: ALLOWED_ORIGINS
        value: "*"

      - key: TELEPHONY_SAMPLE_RATE
        value: "8000"

      - key: TELEPHONY_CHUNK_SIZE_MS
        value: "100"

      - key: VAD_ENERGY_THRESHOLD
        value: "350"

      - key: VAD_SILENCE_DURATION
        value: "1.1"

      - key: VAD_MAX_SPEECH_DURATION
        value: "15.0"
